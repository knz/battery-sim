<!-- 3-phase battery inverter (docs/specs/03-topology-selector.md §2.5b).
     The ONLY topology version 1 models. Selecting it clears topology.approximated.
     240×160 viewBox, single currentColor stroke at 2px, no fills, no external deps. -->
<svg viewBox="0 0 240 160" role="img" aria-label="Three-phase inverter: L1, L2 and L3 all connect into one battery inverter. Supported in version 1." xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <!-- Phase labels and busbars -->
  <text x="16" y="40" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L1</text>
  <line x1="30" y1="36" x2="112" y2="36"/>
  <text x="16" y="82" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L2</text>
  <line x1="30" y1="78" x2="112" y2="78"/>
  <text x="16" y="124" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L3</text>
  <line x1="30" y1="120" x2="112" y2="120"/>
  <!-- The three phases gather into one riser feeding a single battery -->
  <line x1="112" y1="36" x2="112" y2="120"/>
  <line x1="112" y1="78" x2="156" y2="78"/>
  <rect x="156" y="62" width="64" height="32" rx="3"/>
  <text x="188" y="83" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
</svg>
