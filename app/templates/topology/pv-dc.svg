<!-- DC-coupled / hybrid PV topology (specs/03-topology-selector.md §2.5a).
     240×160 viewBox, single currentColor stroke at 2px, no fills, no external deps. -->
<svg viewBox="0 0 240 160" role="img" aria-label="DC-coupled hybrid: PV connects by DC into a hybrid inverter that also holds the battery; one AC connection feeds grid and load. One conversion from PV to battery." xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <!-- PV box -->
  <rect x="12" y="20" width="40" height="28" rx="3"/>
  <text x="32" y="38" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">PV</text>
  <!-- DC line to hybrid inverter -->
  <line x1="52" y1="34" x2="96" y2="34"/>
  <text x="74" y="28" font-size="8" text-anchor="middle" fill="currentColor" stroke="none">DC</text>
  <!-- Hybrid inverter (contains battery) -->
  <rect x="96" y="16" width="72" height="72" rx="4"/>
  <text x="132" y="34" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">hybrid inv</text>
  <rect x="112" y="46" width="40" height="26" rx="3"/>
  <text x="132" y="63" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
  <!-- AC out to bus -->
  <line x1="132" y1="88" x2="132" y2="112"/>
  <text x="150" y="104" font-size="8" text-anchor="middle" fill="currentColor" stroke="none">AC</text>
  <!-- AC bus -->
  <line x1="72" y1="112" x2="192" y2="112"/>
  <!-- grid / load legs -->
  <line x1="96" y1="112" x2="96" y2="140"/>
  <text x="96" y="152" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">grid</text>
  <line x1="168" y1="112" x2="168" y2="140"/>
  <text x="168" y="152" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">load</text>
</svg>
