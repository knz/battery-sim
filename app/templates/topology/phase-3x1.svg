<!-- 3 × 1-phase batteries (specs/03-topology-selector.md §2.5b).
     The second topology version 1 does not model — selecting it raises the soft block
     (check 18) and, if the user continues, sets topology.approximated.
     240×160 viewBox, single currentColor stroke at 2px, no fills, no external deps. -->
<svg viewBox="0 0 240 160" role="img" aria-label="Three times one-phase batteries: each of L1, L2 and L3 carries its own single-phase battery. Not modelled in version 1." xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <!-- L1 -->
  <text x="16" y="40" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L1</text>
  <line x1="30" y1="36" x2="150" y2="36"/>
  <rect x="150" y="22" width="60" height="28" rx="3"/>
  <text x="180" y="41" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
  <!-- L2 -->
  <text x="16" y="82" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L2</text>
  <line x1="30" y1="78" x2="150" y2="78"/>
  <rect x="150" y="64" width="60" height="28" rx="3"/>
  <text x="180" y="83" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
  <!-- L3 -->
  <text x="16" y="124" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L3</text>
  <line x1="30" y1="120" x2="150" y2="120"/>
  <rect x="150" y="106" width="60" height="28" rx="3"/>
  <text x="180" y="125" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
</svg>
