<!-- AC-coupled PV topology (specs/03-topology-selector.md §2.5a).
     240×160 viewBox, single currentColor stroke at 2px, no fills, no external deps. -->
<svg viewBox="0 0 240 160" role="img" aria-label="AC-coupled: PV has its own inverter to AC, the battery has its own inverter to AC, both meet the AC bus feeding grid and load. Two conversions from PV to battery." xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <!-- PV → PV inverter → AC bus -->
  <rect x="10" y="20" width="34" height="24" rx="3"/>
  <text x="27" y="36" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">PV</text>
  <line x1="44" y1="32" x2="64" y2="32"/>
  <rect x="64" y="20" width="44" height="24" rx="3"/>
  <text x="86" y="36" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">PV inv</text>
  <line x1="108" y1="32" x2="150" y2="32"/>
  <line x1="150" y1="32" x2="150" y2="78"/>
  <!-- BAT → batt inverter → AC bus -->
  <rect x="10" y="96" width="34" height="24" rx="3"/>
  <text x="27" y="112" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
  <line x1="44" y1="108" x2="64" y2="108"/>
  <rect x="64" y="96" width="44" height="24" rx="3"/>
  <text x="86" y="112" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">batt inv</text>
  <line x1="108" y1="108" x2="150" y2="108"/>
  <line x1="150" y1="108" x2="150" y2="78"/>
  <!-- AC bus -->
  <line x1="130" y1="78" x2="216" y2="78"/>
  <text x="196" y="72" font-size="8" text-anchor="middle" fill="currentColor" stroke="none">AC</text>
  <!-- grid / load legs -->
  <line x1="150" y1="78" x2="150" y2="140"/>
  <text x="150" y="152" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">grid</text>
  <line x1="200" y1="78" x2="200" y2="140"/>
  <text x="200" y="152" font-size="9" text-anchor="middle" fill="currentColor" stroke="none">load</text>
</svg>
