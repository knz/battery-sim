<!-- 1-phase battery across a 3-phase connection (specs/03-topology-selector.md §2.5b).
     One of the two topologies version 1 does not model — selecting it raises the soft block
     (check 18) and, if the user continues, sets topology.approximated.
     240×160 viewBox, single currentColor stroke at 2px, no fills, no external deps. -->
<svg viewBox="0 0 240 160" role="img" aria-label="One-phase battery: the battery inverter connects to L1 only; L2 and L3 carry no battery. Not modelled in version 1." xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <!-- Phase labels and busbars -->
  <text x="16" y="40" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L1</text>
  <line x1="30" y1="36" x2="120" y2="36"/>
  <text x="16" y="82" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L2</text>
  <line x1="30" y1="78" x2="120" y2="78"/>
  <text x="16" y="124" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">L3</text>
  <line x1="30" y1="120" x2="120" y2="120"/>
  <!-- Only L1 reaches the battery -->
  <line x1="120" y1="36" x2="164" y2="36"/>
  <rect x="164" y="20" width="56" height="32" rx="3"/>
  <text x="192" y="41" font-size="11" text-anchor="middle" fill="currentColor" stroke="none">BAT</text>
</svg>
