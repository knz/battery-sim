# Babel extraction config for the Home Battery Simulator UI strings.
#
# Tells `pybabel extract` where translatable strings live and how to parse each file type.
# Jinja templates use the jinja2.ext.i18n extension (the `_()` / `gettext()` calls); Python
# modules use the standard gettext extractor (for strings wrapped in app/sample_data.py etc).
#
# Workflow (see README):
#   pybabel extract -F babel.cfg -k _N -k _msg -k _msg_n:1,2 --sort-output --no-location \
#           -o app/locales/messages.pot .
#   pybabel update  -i app/locales/messages.pot -d app/locales -l nl --no-fuzzy-matching  (and -l en)
#   pybabel compile -d app/locales
#
# `--no-fuzzy-matching` on the update is REQUIRED. Without it, pybabel guesses a translation for
# a new msgid from a similar existing one: "Extra grid import" was once given the Dutch for a
# different string and shipped as "Netafname T2". It is marked `#, fuzzy` in the .po, but it
# compiles and reaches the user regardless, and nothing on the page flags it as wrong.
#
# All three `-k` keywords are REQUIRED, not optional. Babel's default keyword list knows none of
# them, and extracting without one silently drops its msgids — the run "succeeds" and the .po/.mo
# files come back smaller.
#
#   -k _N            app/sample_data.py marks its chrome strings with the project-local alias
#                    `_N(...)` (a no-op tagger — the view-model carries English source strings
#                    that the templates translate via _()). ~50 msgids.
#   -k _msg          `msg(msgid, **params)` from app/i18n.py, imported as `_msg` by the view
#                    modules that build messages (app/results_view.py, app/data_view.py): a
#                    view-model message as a (msgid, params) pair, so the msgid stays a
#                    compile-time constant while the runtime figures ride alongside. First
#                    argument is the msgid. The keyword matches the NAME AT THE CALL SITE, so a
#                    view module must import it under this alias or its msgids are dropped.
#   -k _msg_n:1,2    its counted counterpart `_msg_n(singular, plural, n, **params)`. The `1,2`
#                    tells Babel arguments 1 and 2 are the singular and plural forms, which is
#                    what makes the entry come out with `msgid_plural` rather than as two
#                    unrelated msgids.
#
# `--sort-output` matches the committed catalogs' ordering;
# they also carry no `#:` location comments, which is what `pybabel update` preserves by default.

[jinja2: app/templates/**.html]
extensions = jinja2.ext.i18n

[python: app/**.py]
