# Babel extraction config for the Home Battery Simulator UI strings.
#
# Tells `pybabel extract` where translatable strings live and how to parse each file type.
# Jinja templates use the jinja2.ext.i18n extension (the `_()` / `gettext()` calls); Python
# modules use the standard gettext extractor (for strings wrapped in app/sample_data.py etc).
#
# Workflow (see README):
#   pybabel extract -F babel.cfg -k _N --sort-output -o app/locales/messages.pot .
#   pybabel update  -i app/locales/messages.pot -d app/locales -l nl   (and -l en)
#   pybabel compile -d app/locales
#
# The `-k _N` is REQUIRED, not optional. app/sample_data.py marks its chrome strings with the
# project-local alias `_N(...)` (a no-op tagger — the view-model carries English source strings
# that the templates translate via _()). Babel's default keyword list does not know `_N`, so
# extracting without it silently drops ~50 msgids from the catalogs — the run "succeeds" and the
# .po/.mo files come back smaller. `--sort-output` matches the committed catalogs' ordering;
# they also carry no `#:` location comments, which is what `pybabel update` preserves by default.

[jinja2: app/templates/**.html]
extensions = jinja2.ext.i18n

[python: app/**.py]
