# Release builds, triggered by a `v*` tag (or manually, for a dry run).
#
# Jobs:
#     version-gate     assert the pushed tag agrees with `app.__version__`; blocks everything.
#     linux            build-appimage.sh, then verify the artifact, then upload. BLOCKING.
#     desktop-bundle   PyInstaller onedir, as a matrix over macos-26, macos-26-intel and
#                      windows-latest. All three BLOCKING since 2026-08-06; see below.
#     release          collect whatever was produced into a DRAFT GitHub release.
#
# ## Why the version gate runs first and blocks
#
# `app/__init__.py::__version__` is the single source of the version string: pyproject.toml reads
# it through hatchling, `app.config.APP_VERSION` re-exports it, and a test in
# tests/test_desktop.py asserts the two agree. The one thing none of that can check is the TAG,
# which is written by hand at release time. A tag of `v0.2.0` on a tree that still says "0.1.0"
# produces a perfectly good build with the wrong name on it — an artifact that is silently
# mislabelled is worse than a build that failed, because the failure is discovered by whoever
# downloads it. So the tag is checked against the source before anything is built.
#
# The check is skipped on `workflow_dispatch`, where there is no tag to compare against.
#
# ## Why workflow_dispatch exists at all
#
# Several things in here cannot be tested any other way. Requiring a tag to exercise them would
# mean either cutting throwaway tags or debugging in the only run that matters. Manual dispatch
# builds and uploads artifacts without creating a release.
#
# It has since done its job twice over: run 31032747998 (2026-08-05) settled the FUSE question
# below AND gave the three non-Linux jobs their first execution. All three passed.
#
# ## Why the Linux job pins ubuntu-24.04 and not ubuntu-latest
#
# This label is load-bearing. packaging/build-appimage.sh copies the SYSTEM python3-gi into the
# frozen bundle, and fails the build (search it for `GI_ABI_TAG`) when the frozen interpreter's
# Python minor version differs from the compiled `_gi` extension's — a mismatch is an undefined-symbol
# error at `import gi` on the user's machine, which the script turns into a build failure
# instead. build-linux.sh pins `uv venv --python 3.12`; Ubuntu 24.04 ships Python 3.12 and
# `_gi.cpython-312`, so they agree. Ubuntu 22.04 ships 3.10 and would trip the gate. Moving to a
# newer image is therefore a decision about that pairing, not a version bump.
#
# The consequence, recorded rather than discovered later: build-appimage.sh links against the
# HOST's glibc (it says so in its own header), so an artifact built on 24.04 has a glibc floor of
# 2.39 and will NOT run on Debian 12 or anything older. That is accepted for now; building in an
# older-glibc container is the portable route and is not done here.
#
# ## The non-Linux jobs are BLOCKING, and what is still unfinished about them
#
# They were `continue-on-error: true` until 2026-08-06. That flag did exactly one thing: it kept a
# broken build from reddening the run. It never gated publishing — nothing here inspects signature
# state, and the release job's own `always() && needs.linux.result == 'success'` condition already
# guaranteed the thing the flag was nominally protecting, namely that a dead macOS runner cannot
# withhold a working Linux release. So it was redundant, and its cost was real: an amber job is one
# nobody looks at, and a broken Windows build would have surfaced as a user reporting a missing
# download rather than as a red tag run.
#
# Removed after verifying per-job conclusions (not just the run's top-level status, which is what
# continue-on-error manufactures) on runs 31094839305 and 31093496577, both 2026-08-06, both with
# all three desktop jobs green.
#
# There is no macOS or Windows build script — build-linux.sh is bash with POSIX paths — so these
# jobs invoke `pyinstaller packaging/battery-sim.spec` directly. The "(unfinished)" in each matrix
# label refers to the packaging gaps below, NOT to the jobs' reliability: building and signing are
# separate properties, and only the first is done.
#
# Windows has since been tightened: the spec now sets an icon and generates a VERSIONINFO
# resource carrying the version and the build SHA, so the exe is identifiable once downloaded.
# What is still missing there is an installer and code signing — the artifact remains a ZIP of an
# onedir tree, and an unsigned one, so first-run SmartScreen warnings are expected. `console=True`
# is also still set on purpose: the launcher prints its URL and its fallback reason to stderr, and
# that channel stays until the new fallback dialog (app/desktop.py::_show_fallback_dialog) has
# been looked at on a real Windows machine.
#
# macOS has since been tightened too: the spec's `BUNDLE(...)` block wraps the COLLECT output as
# `Home Battery Simulator.app`, with an icon, a bundle identifier and the version in its Info.plist,
# so what ships is a double-clickable app rather than the raw onedir directory it used to be. The
# archive step below zips the `.app` and not the bare directory beside it.
#
# What is still missing on macOS is SIGNING. Bundling and signing are independent, and only the
# first is done: `codesign_identity=None`, so there is no Developer ID signature and no
# notarization. PyInstaller applies an AD-HOC signature — which is what lets the binary run at all
# on Apple silicon, since arm64 macOS refuses a completely unsigned one — but Gatekeeper still
# quarantines the download, so the first-run refusal documented in docs/*/security-warnings.md is
# expected. See the BUNDLE block in packaging/battery-sim.spec for the full reasoning.
#
# That tightening has now happened, which is what the section above records. What remains open is
# the packaging itself — signing on both platforms, an installer on Windows — and those gaps are
# invisible to CI either way, since an unsigned bundle builds perfectly well. Blocking on build
# failure does not and cannot track them.
#
# Two consequences worth knowing before the next red run is blamed on this change. Both were
# previously absorbed silently and now fail the run: a retired runner label (macos-26-intel dies
# with macos-15 in Fall 2027), and PyInstaller being unpinned in both this workflow and
# build-linux.sh, so a bad upstream release lands directly in a tag build.
#
# ## Runner labels for macOS
#
# macos-13 was retired in December 2025 and macos-14 is unsupported from 2026-11-02, so both of
# the obvious labels are dead. Intel is `macos-26-intel` and Apple silicon is `macos-26`. Note
# that Intel macOS support ends entirely when macos-15 retires in Fall 2027; the x86_64 job has a
# scheduled end of life whether or not anyone acts on it.
#
# ## Action versions
#
# checkout v7 / upload-artifact v7 / download-artifact v8 / setup-uv v7 / setup-node v7 /
# action-gh-release v3, each verified against the tags that actually exist on the action's
# repository (`git ls-remote --tags`), not against a version someone believed was current.
#
# That distinction is not pedantry. The first PR to run this workflow failed with "Unable to
# resolve action astral-sh/setup-uv@v9, unable to find version v9" — the pin had been taken from
# research that reported a version which does not exist, and nothing before a real run catches
# that. Re-checking every pin afterwards also turned up setup-node pinned a major behind. If a
# version here is ever changed, confirm the tag exists first.
#
# Note that upload-artifact and download-artifact are NOT on matched majors — they are released
# independently, so picking the same number for both is wrong.
#
# Older majors are avoided because Node.js 20 is being removed from the runner images (reportedly
# around 2026-09-16 — moderately confirmed, not from an authoritative changelog), which breaks
# checkout v4 and upload-artifact v3/v4.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default for every job: read-only. Only the `release` job widens this, and only to
# `contents: write`, which is what creating a release and attaching assets needs.
permissions:
  contents: read

# Pinned build tool for the desktop-bundle matrix, which invokes PyInstaller directly instead of
# going through build-linux.sh. The Linux/AppImage job is NOT covered by this — it runs
# build-linux.sh, which carries its own PYINSTALLER_VERSION. Bump both together.
env:
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  version-gate:
    name: Tag matches app.__version__
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag against app/__init__.py
        run: |
          set -euo pipefail
          SRC_VERSION="$(python3 -c "
          import re, pathlib
          text = pathlib.Path('app/__init__.py').read_text()
          m = re.search(r'^__version__\s*=\s*[\"\x27]([^\"\x27]+)', text, re.M)
          if not m:
              raise SystemExit('could not find __version__ in app/__init__.py')
          print(m.group(1))
          ")"
          echo "app.__version__ = $SRC_VERSION"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch: no tag to compare against, gate skipped."
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag            = $TAG"
          if [ "$TAG" != "v$SRC_VERSION" ]; then
            echo "::error::tag $TAG does not match app.__version__ ($SRC_VERSION)."
            echo "The tag names the release; app/__init__.py is the single source of the version"
            echo "string (pyproject.toml and app.config.APP_VERSION both read it). Building on a"
            echo "mismatch would attach a correctly-built artifact under the wrong version."
            echo "Either bump __version__ to $TAG (minus the leading v) or retag as v$SRC_VERSION."
            exit 1
          fi
          echo "ok"

  linux:
    name: Linux AppImage
    needs: version-gate
    runs-on: ubuntu-24.04
    # Build + AppImage + the packaged test suites, which start the artifact several times.
    timeout-minutes: 45
    env:
      # appimagetool is ITSELF an AppImage and mounts via FUSE. build-appimage.sh has no
      # workaround for a FUSE-less environment — unlike packaging/verify-appimage-isolated.sh,
      # which sets this variable explicitly. Two routes are provided here: this variable, which
      # tells the AppImage runtime to self-extract rather than mount, and libfuse2t64 installed
      # below, which makes the mount path work.
      #
      # MEASURED on the first dispatch run (2026-08-05, run 31032747998): the build produced no
      # extraction messages, so appimagetool MOUNTED — libfuse2t64 is what carried it, and this
      # variable did not take effect. Keeping both was the right call; the variable alone would
      # most likely have failed. Do not remove libfuse2t64 on the theory that the env var covers
      # it. If this job ever fails inside appimagetool, the apt package is the thing to check.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # The list is taken from what packaging/build-appimage.sh checks for and copies:
      #   gir1.2-webkit2-4.1  -> the WebKit2-4.1 typelib and /usr/lib/*/webkit2gtk-4.1 helpers,
      #                          both named in the script's precondition loop;
      #   python3-gi          -> /usr/lib/python3/dist-packages/gi, also a precondition, and the
      #                          source of the _gi ABI the version check compares;
      #   libwebkit2gtk-4.1-0, libgtk-3-0, libgirepository-1.0-1
      #                       -> the libraries LIB_ROOTS walks with ldd (libgdk-3 and
      #                          libjavascriptcoregtk-4.1 come in as dependencies of these);
      #   librsvg2-common     -> the gdk-pixbuf SVG loader, copied with the loader directory;
      #   glib-networking     -> the GIO TLS/proxy modules under /usr/lib/*/gio/modules;
      #   adwaita/hicolor icon themes -> the two names the icon-copy loop looks for.
      # Most are already on the runner image; naming them means the build does not depend on
      # that staying true.
      #
      # `python3-tk` is here for a different reason than the rest, and it is not optional. The
      # spec deliberately does NOT exclude tkinter, because app/desktop.py::_show_fallback_dialog
      # uses it to show the server URL when the webview cannot open. But PyInstaller can only
      # bundle what it can import at build time, and run 31094839305 logged
      #
      #     WARNING: tkinter installation is broken. It will be excluded from the application
      #
      # on this job — so the Linux fallback dialog was silently absent from every AppImage built
      # before 2026-08-06, on exactly the machines it exists for. macOS and Windows were fine
      # (their logs show hook-_tkinter and pyi_rth__tkinter, no warning); this was Linux-only.
      #
      # It must be the apt package rather than a pip install because tkinter is a C extension
      # against system Tcl/Tk, not a PyPI distribution. It attaches to /usr/bin/python3.12, which
      # is what `uv venv --python 3.12` in build-linux.sh resolves to on this runner — verified in
      # the same run's log, and the reason a uv-managed standalone build would not have helped.
      - name: Install the GTK / WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-tk \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libgirepository-1.0-1 \
            librsvg2-common \
            glib-networking \
            adwaita-icon-theme \
            hicolor-icon-theme \
            libfuse2t64 \
            desktop-file-utils

      # The dev group, needed by the verification step below. build-appimage.sh does NOT use this
      # environment — it builds its own throwaway venv outside the repo precisely so that the dev
      # packages cannot reach the bundle — so the two do not interfere.
      - name: Install dependencies (for the post-build verification)
        run: uv sync

      # Builds the onedir bundle first if it is absent, then the AppImage. The script enforces
      # its own size gate, asset checks, Babel locale checks and library-closure check; a failure
      # in any of those fails here.
      - name: Build the AppImage
        run: packaging/build-appimage.sh

      # Verify the artifact that is about to be uploaded, not a rebuild of it. These three files
      # skip entirely without the env gates, which is why they contribute nothing in test.yml —
      # this is the only place they run.
      #
      # tests/test_packaged_ingest.py calls `pytest.importorskip("websockets")` in five places.
      # websockets 16.1.1 IS present: it comes in through the `uvicorn[standard]` extra, which is
      # a RUNTIME dependency in pyproject.toml (uv.lock, uvicorn's optional-dependencies), so it
      # is installed regardless of the dev group. That matters — those are the tests covering the
      # `ws="auto"` behaviour, and a silent importorskip would leave the release verification
      # green while checking nothing at exactly the point it is most needed. If this step ever
      # reports skips in that file, the extra has gone missing and the gap must be closed before
      # shipping.
      - name: Verify the built artifacts
        env:
          BATTERY_SIM_APPIMAGE: dist/Home-Battery-Simulator-x86_64.AppImage
          BATTERY_SIM_PACKAGED_BINARY: dist/battery-sim/battery-sim
        run: |
          uv run pytest -v \
            tests/test_appimage.py \
            tests/test_packaged.py \
            tests/test_packaged_ingest.py

      # build-appimage.sh hardcodes `Home-Battery-Simulator-x86_64.AppImage` with no version in
      # it, so every release would otherwise attach a file whose name is identical to the last
      # one's — indistinguishable once downloaded. The rename happens HERE and not in the script
      # on purpose: a local build keeps a stable, predictable output path that the verify scripts
      # and the tests' env vars can name without knowing the version.
      - name: Name the artifact after the version
        id: name
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "
          import re, pathlib
          print(re.search(r'^__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('app/__init__.py').read_text(), re.M).group(1))
          ")"
          OUT="dist/Home-Battery-Simulator-${VERSION}-x86_64.AppImage"
          mv dist/Home-Battery-Simulator-x86_64.AppImage "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: ${{ steps.name.outputs.path }}
          if-no-files-found: error

  # ── the unfinished platforms ────────────────────────────────────────────────
  #
  # One matrix, three runners. Blocking since 2026-08-06; see the header. "Unfinished" here means
  # unsigned, and on Windows without an installer — not unreliable.

  desktop-bundle:
    name: ${{ matrix.label }}
    needs: version-gate
    # `fail-fast: false` is kept and is independent of the blocking question: one platform failing
    # must not cancel the other two mid-build, or a release run reports the state of one runner
    # instead of three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macOS arm64 (unfinished)
            artifact: macos-arm64
          - runner: macos-26-intel
            label: macOS x86_64 (unfinished)
            artifact: macos-x86_64
          - runner: windows-latest
            label: Windows (unfinished)
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # No dev group: this environment becomes the bundle's contents, and the spec's `excludes`
      # list names pytest/playwright/httpx precisely so they cannot be collected. Keeping them out
      # here means that exclude list stays a backstop rather than the thing actually doing the
      # work — see the `--no-sync` note on the build step, which is what preserves this.
      # PyInstaller is installed as a build tool rather than declared in pyproject.toml, matching
      # what build-linux.sh does on Linux.
      #
      # Pinned, because PyInstaller is not in uv.lock and an unpinned install would otherwise pick
      # up whatever version is current on the day the release runs. These runners invoke
      # PyInstaller directly rather than through build-linux.sh, so the pin has to be repeated
      # here; keep the workflow-level PYINSTALLER_VERSION in step with build-linux.sh.
      #
      # `${{ env.… }}` rather than a shell variable: this matrix includes windows-latest, where
      # `run:` defaults to PowerShell and `$PYINSTALLER_VERSION` would expand to nothing, turning
      # the pin into a bare `pyinstaller==`. Actions expansion happens before the shell sees it.
      - name: Install runtime dependencies and PyInstaller
        run: |
          uv sync --no-dev
          uv pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      # `--no-sync` is load-bearing, not tidiness. A plain `uv run` re-syncs the environment
      # against the lockfile before running, which breaks the step above in two ways at once.
      # Both were reproduced locally against this project's own pyproject.toml and uv.lock:
      #
      #   1. It undoes `--no-dev`. `uv run` syncs WITH the dev group by default, so pytest,
      #      playwright and httpx are reinstalled into the very environment PyInstaller is about
      #      to analyse — one step after `uv sync --no-dev` deliberately left them out. The build
      #      would still produce a correct bundle, because the spec's EXCLUDES list names those
      #      packages, but it would be leaning on that safety net rather than on the environment
      #      actually being clean. A redundancy that is silently load-bearing is not a redundancy.
      #
      #   2. It may evict PyInstaller itself. PyInstaller is installed with `uv pip install` and
      #      is deliberately NOT in pyproject.toml (a build tool, not a dependency — the same
      #      reasoning build-linux.sh gives). Since the lockfile does not mention it, `uv run -v`
      #      can be seen logging `Unnecessary package: pyinstaller` — i.e. a removal candidate.
      #      It survived when tested, but that is uv's discretion, not a guarantee.
      #
      # `--no-sync` skips the sync entirely and runs against the environment as installed, which
      # answers both. `--no-dev` was considered and is weaker: it fixes (1) but still performs a
      # sync, leaving (2) live.
      # Stamps app/_build_info.py with GITHUB_SHA, which the spec reads when it generates the
      # Windows VERSIONINFO resource. build-linux.sh does this itself for the Linux job; these
      # runners invoke PyInstaller directly, so the step is explicit here.
      #
      # No restore afterwards: the runner's checkout is discarded at the end of the job, and
      # nothing later in it reads the file. build-linux.sh traps a restore because it runs on
      # developer machines, where leaving a committed file modified would be rude.
      - name: Stamp the build SHA
        run: uv run --no-sync python packaging/build_info.py

      - name: Build the onedir bundle
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/battery-sim.spec

      # Zipped rather than uploaded as a tree: upload-artifact would otherwise transfer several
      # thousand small files, and on macOS/Linux a plain upload does not preserve the executable
      # bit on the launcher.
      #
      # macOS archives the `.app` and NOT the bare onedir directory beside it. The spec's
      # BUNDLE(...) wraps the same COLLECT output, so `dist/battery-sim/` and
      # `dist/Home Battery Simulator.app/` are two views of one build — shipping both would
      # double the download to no purpose. The .app is the one a user can double-click.
      #
      # `-y` is load-bearing here in a way it is not on Linux: it stores symlinks AS symlinks.
      # A .app is full of them (Contents/Frameworks, the versioned dylib layout), and following
      # them instead would both inflate the archive and break the ad-hoc code signature, whose
      # hashes cover the link structure. `zip` is used rather than `ditto` because it is what the
      # Linux branch already uses; `ditto --sequesterRsrc --keepParent` would be the more
      # idiomatic macOS choice if this ever needs resource forks.
      - name: Archive the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry "battery-sim-${{ matrix.artifact }}.zip" "Home Battery Simulator.app"

      # No Linux branch here on purpose: this matrix is macOS and Windows only. Linux is built by
      # the separate `linux` job above, which produces an AppImage rather than a zipped onedir.

      - name: Archive the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/battery-sim -DestinationPath "dist/battery-sim-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.artifact }}
          path: dist/battery-sim-${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    needs: [linux, desktop-bundle]
    timeout-minutes: 15
    # `always()` so a failed desktop platform does not withhold the release; the Linux job is
    # checked explicitly, so a broken macOS build cannot stop a working Linux one from shipping,
    # while a broken Linux build still stops everything.
    #
    # This is load-bearing and became MORE so on 2026-08-06. It is what actually protects the
    # Linux release, and it is why continue-on-error on the desktop matrix was redundant. Without
    # `always()`, a failed desktop job would now skip this job and withhold the release entirely.
    if: always() && needs.linux.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Downloads every artifact that WAS produced, each into its own subdirectory. Jobs that
      # failed simply contributed nothing, so the release carries whatever exists.
      #
      # No `name:` on purpose — omitting it downloads ALL artifacts for the run, and leaving
      # `merge-multiple` at its default false extracts each into its own named directory, which
      # is what the `artifacts/**/*` glob below expects.
      #
      # v8 is download-artifact's current major. It is deliberately NOT matched to
      # upload-artifact's v7: the two actions are versioned independently and do not track
      # lockstep majors, so "use the same number" is not a rule that holds here.
      - name: Collect the artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List what was collected
        run: find artifacts -type f -printf '%p  (%s bytes)\n'

      # Draft, deliberately. A desktop platform may still be missing entirely — the jobs block the
      # run now, but `always()` above means the release is still drafted from whatever was
      # produced, and `fail_on_unmatched_files: false` below tolerates the gap. So a release can
      # still arrive with fewer downloads than the README promises, and nothing here checks that.
      # Nothing is code-signed either, and the release notes need a human anyway. Publishing is a
      # decision, not a side effect of pushing a tag.
      #
      # The macOS attachment is a zipped `Home Battery Simulator.app` (see the header), not the raw
      # onedir tree it once was.
      #
      # ## What the assets look like, since it is asked every time
      #
      # This step attaches the files INSIDE each downloaded artifact directory, so a release asset
      # has ONE layer of zip and not two. The doubled zip people notice
      # (`bundle-windows-x86_64.zip` containing `battery-sim-windows-x86_64.zip`) comes from
      # downloading an artifact off the Actions run page, where GitHub adds a wrapper of its own;
      # `download-artifact` above strips that wrapper, so it never reaches a release.
      #
      # The remaining zip is load-bearing: a release asset is a single file and a PyInstaller
      # onedir bundle is several thousand. Removing it would mean onefile — ruled out, see the
      # COLLECT block in packaging/battery-sim.spec, because onefile unpacks to a temp directory
      # that is deleted on exit and the default data directory would go with it — or an installer,
      # which does not exist yet. The AppImage needs none of this and attaches as a bare
      # executable.
      - name: Create the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
